<!DOCTYPE html>
<html>
<head>
    <title>Emotion Music Player</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121212;
            color: #fff;
            text-align: center;
            padding-top: 60px;
        }
        h1 { font-size: 32px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .box {
            background: #1e1e1e;
            padding: 30px;
            display: inline-block;
            border-radius: 16px;
            margin-top: 20px;
            max-width: 400px;
        }
        video, canvas {
            width: 280px;
            height: 210px;
            border-radius: 10px;
            background: #000;
        }
        video { display: block; margin: 0 auto; }
        canvas { display: none; }
        img#preview { display: none; width: 280px; border-radius: 10px; }
        button {
            padding: 12px 24px;
            margin: 8px 4px;
            font-size: 15px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-green { background: #1db954; color: #fff; }
        .btn-green:hover { background: #1ed760; }
        .btn-blue { background: #333; color: #fff; border: 1px solid #555; }
        .btn-blue:hover { background: #444; }
        .btn-orange { background: #e8590c; color: #fff; }
        .btn-orange:hover { background: #f76707; }
        .or-text { color: #555; margin: 12px 0; font-size: 13px; }
        .error { color: #f44336; margin: 10px 0; }

        input[type="file"] { display: none; }
        label {
            padding: 12px 24px;
            background: #333;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            display: inline-block;
            font-size: 15px;
            font-weight: 600;
            border: 1px solid #555;
        }
        label:hover { background: #444; }
    </style>
</head>
<body>
    <h1>Emotion Music Player</h1>
    <p style="color:#b3b3b3">Show your face to play matching music</p>

    <div class="box">
        <video id="video" autoplay></video>
        <canvas id="canvas"></canvas>
        <img id="preview">
        <br>
        <button id="captureBtn" class="btn-orange">📷 Capture</button>
        <button id="retryBtn" class="btn-blue" style="display:none">↻ Retry</button>
        <button id="detectBtn" class="btn-green" style="display:none">🎵 Detect Mood</button>

        <div class="or-text">— or —</div>

        <form id="uploadForm" method="post" enctype="multipart/form-data">
            <label for="fileInput">📁 Choose Photo</label>
            <input type="file" id="fileInput" name="image" accept="image/*">
            <br><br>
            <button type="submit" class="btn-green">Upload & Detect</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const preview = document.getElementById("preview");
        const captureBtn = document.getElementById("captureBtn");
        const retryBtn = document.getElementById("retryBtn");
        const detectBtn = document.getElementById("detectBtn");
        const fileInput = document.getElementById("fileInput");
        let stream = null;

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(s => { stream = s; video.srcObject = s; })
            .catch(() => { captureBtn.disabled = true; captureBtn.textContent = "Webcam unavailable"; });

        captureBtn.onclick = () => {
            canvas.width = video.videoWidth || 320;
            canvas.height = video.videoHeight || 240;
            canvas.getContext("2d").drawImage(video, 0, 0);
            preview.src = canvas.toDataURL("image/jpeg");
            preview.style.display = "block";
            video.style.display = "none";
            captureBtn.style.display = "none";
            retryBtn.style.display = "inline-block";
            detectBtn.style.display = "inline-block";
            if (stream) stream.getTracks().forEach(t => t.stop());
        };

        retryBtn.onclick = () => {
            preview.style.display = "none";
            video.style.display = "block";
            captureBtn.style.display = "inline-block";
            retryBtn.style.display = "none";
            detectBtn.style.display = "none";
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(s => { stream = s; video.srcObject = s; });
        };

        detectBtn.onclick = () => {
            canvas.toBlob(blob => {
                const fd = new FormData();
                fd.append("image", blob, "capture.jpg");
                const form = document.createElement("form");
                form.method = "POST";
                form.enctype = "multipart/form-data";
                const input = document.createElement("input");
                input.type = "file";
                input.name = "image";
                const dt = new DataTransfer();
                dt.items.add(new File([blob], "capture.jpg", { type: "image/jpeg" }));
                input.files = dt.files;
                form.appendChild(input);
                document.body.appendChild(form);
                form.submit();
            }, "image/jpeg");
        };

        fileInput.onchange = () => document.getElementById("uploadForm").submit();
    </script>
</body>
</html>
